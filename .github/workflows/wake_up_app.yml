name: Wake Up Streamlit App (Sachsen Feiertage mit Button-Klick)

on:
  schedule:
    # Montag bis Freitag um 05:00 UTC (ca. 6:00 Uhr im Winter / 7:00 Uhr im Sommer in DE)
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  ping_if_working_day:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2 # Aktualisiert auf die neueste Version

      - name: Set up Python
        uses: actions/setup-python@v5.3.0 # Aktualisiert auf die neueste Version
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install holidays requests playwright
          playwright install chromium

      - name: Check for holiday and wake up app
        shell: python
        run: |
          import sys
          import datetime
          import holidays
          import time
          from playwright.sync_api import sync_playwright

          # Aktuelles Datum in Deutschland berechnen
          today_de = (datetime.datetime.utcnow() + datetime.timedelta(hours=1)).date()
          
          # Feiertage speziell für Sachsen ('SN') laden
          sachsen_holidays = holidays.Germany(years=today_de.year, subdiv='SN')

          if today_de in sachsen_holidays:
              print(f"Heute ({today_de}) ist ein Feiertag in Sachsen: {sachsen_holidays.get(today_de)}. App bleibt im Winterschlaf.")
              sys.exit(0)
          
          print(f"Heute ({today_de}) ist ein normaler Werktag in Sachsen. Starte Browser zum Aufwecken...")
          
          url = "https://mein-problem-melden.streamlit.app/?platz=Alba"
          
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print(f"Öffne {url}...")
              page.goto(url)
              
              time.sleep(5)
              
              button = page.get_by_role("button", name="Yes, get this app back up!", exact=False)
              
              if button.count() > 0:
                  print("Schlafmodus-Seite erkannt. Klicke auf den 'Yes, get this app back up!' Button...")
                  button.click()
                  time.sleep(15)
                  print("Button erfolgreich geklickt und Startvorgang eingeleitet!")
              else:
                  print("Die App war anscheinend schon wach oder der Button wurde nicht gefunden.")
              
              browser.close()
